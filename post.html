<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>منشور AdenTweet</title><link rel="stylesheet" href="styles.css"></head><body><main class="legal-shell"><a class="brand" href="index.html">AdenTweet</a><article class="legal-card"><p class="eyebrow">ADENTWEET POST</p><h1 id="author">جارٍ تحميل المنشور…</h1><p id="handle"></p><p id="body" style="white-space:pre-wrap;font-size:1.1rem;line-height:1.9"></p><p id="meta"></p></article></main><script>const U='https://jjrjwkochqqdjyodcewa.supabase.co',K='sb_publishable_R3MEzkQYDUeSCqS1NYqSyg_P9ylO3zg',id=new URLSearchParams(location.search).get('id'),h={apikey:K,Authorization:'Bearer '+K};if(!id){document.getElementById('author').textContent='الرابط غير مكتمل'}else fetch(U+'/rest/v1/posts?id=eq.'+encodeURIComponent(id)+'&select=body,created_at,likes_count,reposts_count,author:profiles!posts_author_id_fkey(display_name,username)',{headers:h}).then(r=>r.json()).then(x=>{const p=x[0];if(!p){document.getElementById('author').textContent='المنشور غير متاح';return}document.getElementById('author').textContent=p.author?.display_name||'AdenTweet';document.getElementById('handle').textContent='@'+(p.author?.username||'');document.getElementById('body').textContent=p.body;document.getElementById('meta').textContent=new Date(p.created_at).toLocaleString('ar')+' · '+p.likes_count+' إعجاب · '+p.reposts_count+' إعادة نشر'}).catch(()=>document.getElementById('author').textContent='تعذر تحميل المنشور');</script></body></html>
