<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صارحني برسالة | AdenTweet</title><link rel="stylesheet" href="styles.css"></head><body><main class="legal-shell"><a class="brand" href="index.html">AdenTweet</a><section class="legal-card"><p class="eyebrow">SARAHNI</p><h1 id="title">أرسل رسالة مجهولة</h1><p id="subtitle">لن تظهر هويتك لصاحب الحساب. التزم باحترام المجتمع.</p><form id="form"><label for="body">رسالتك</label><textarea id="body" maxlength="1000" required placeholder="اكتب رسالتك باحترام…"></textarea><p id="count">0 / 1000</p><button id="send" type="submit">إرسال الرسالة</button><p id="status" role="status"></p></form></section></main><script>
const URL='https://jjrjwkochqqdjyodcewa.supabase.co';const KEY='sb_publishable_R3MEzkQYDUeSCqS1NYqSyg_P9ylO3zg';const user=new URLSearchParams(location.search).get('u');const headers={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};const body=document.getElementById('body'),status=document.getElementById('status'),send=document.getElementById('send');
if(!user){status.textContent='الرابط غير مكتمل.';send.disabled=true}else{fetch(URL+'/rest/v1/profiles?username_normalized=eq.'+encodeURIComponent(user.toLowerCase())+'&select=display_name,username,sarahni_enabled,sarahni_notice',{headers}).then(r=>r.json()).then(rows=>{const p=rows[0];if(!p||!p.sarahni_enabled){document.getElementById('title').textContent='صارحني غير متاح';document.getElementById('subtitle').textContent='هذا الحساب لا يستقبل رسائل مجهولة حاليًا.';send.disabled=true;return}document.getElementById('title').textContent='أرسل رسالة مجهولة إلى '+p.display_name;document.getElementById('subtitle').textContent=p.sarahni_notice||'لن تظهر هويتك لصاحب الحساب. التزم باحترام المجتمع.'}).catch(()=>{status.textContent='تعذر فتح الحساب الآن.';send.disabled=true})}
body.addEventListener('input',()=>document.getElementById('count').textContent=body.value.length+' / 1000');document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();send.disabled=true;status.textContent='جارٍ الإرسال…';const fingerprint=crypto.randomUUID?crypto.randomUUID():String(Date.now());const r=await fetch(URL+'/rest/v1/rpc/send_sarahni_message',{method:'POST',headers,body:JSON.stringify({p_recipient_username:user,p_body:body.value,p_sender_fingerprint:fingerprint})});if(r.ok){body.value='';document.getElementById('count').textContent='0 / 1000';status.textContent='تم إرسال رسالتك بنجاح.'}else{status.textContent='تعذر إرسال الرسالة. راجع المحتوى أو حاول لاحقًا.'}send.disabled=false});
</script></body></html>
